<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="currentColor">
  <!--
    Pulli Kolam Type 1 — 3×3 grid
    9 dots at 60px spacing (center: 100,100)
    Classic interlocking figure-8 loops around each dot
    Traditional Tamil pulli kolam pattern
  -->
  <g stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- Outer frame loops — 4 corner arcs -->
    <!-- Top-left to top-right loop (above row 1) -->
    <path d="M 40 40 C 40 15 160 15 160 40"/>
    <!-- Bottom loop -->
    <path d="M 40 160 C 40 185 160 185 160 160"/>
    <!-- Left loop -->
    <path d="M 40 40 C 15 40 15 160 40 160"/>
    <!-- Right loop -->
    <path d="M 160 40 C 185 40 185 160 160 160"/>

    <!-- Inner connecting loops — horizontal figure-8s across top row -->
    <path d="M 40 40 C 55 28 75 28 100 40 C 125 52 145 52 160 40"/>
    <path d="M 40 40 C 55 52 75 52 100 40 C 125 28 145 28 160 40"/>

    <!-- Inner connecting loops — horizontal figure-8s across middle row -->
    <path d="M 40 100 C 55 88 75 88 100 100 C 125 112 145 112 160 100"/>
    <path d="M 40 100 C 55 112 75 112 100 100 C 125 88 145 88 160 100"/>

    <!-- Inner connecting loops — horizontal figure-8s across bottom row -->
    <path d="M 40 160 C 55 148 75 148 100 160 C 125 172 145 172 160 160"/>
    <path d="M 40 160 C 55 172 75 172 100 160 C 125 148 145 148 160 160"/>

    <!-- Vertical figure-8s — left column -->
    <path d="M 40 40 C 28 55 28 75 40 100 C 52 125 52 145 40 160"/>
    <path d="M 40 40 C 52 55 52 75 40 100 C 28 125 28 145 40 160"/>

    <!-- Vertical figure-8s — middle column -->
    <path d="M 100 40 C 88 55 88 75 100 100 C 112 125 112 145 100 160"/>
    <path d="M 100 40 C 112 55 112 75 100 100 C 88 125 88 145 100 160"/>

    <!-- Vertical figure-8s — right column -->
    <path d="M 160 40 C 148 55 148 75 160 100 C 172 125 172 145 160 160"/>
    <path d="M 160 40 C 172 55 172 75 160 100 C 148 125 148 145 160 160"/>
  </g>

  <!-- Pulli dots — 3×3 grid -->
  <g fill="currentColor">
    <circle cx="40"  cy="40"  r="5"/>
    <circle cx="100" cy="40"  r="5"/>
    <circle cx="160" cy="40"  r="5"/>
    <circle cx="40"  cy="100" r="5"/>
    <circle cx="100" cy="100" r="5"/>
    <circle cx="160" cy="100" r="5"/>
    <circle cx="40"  cy="160" r="5"/>
    <circle cx="100" cy="160" r="5"/>
    <circle cx="160" cy="160" r="5"/>
  </g>
</svg>
