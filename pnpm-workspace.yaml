allowBuilds:
  esbuild: true
  sharp: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Force patched sub-dependency versions to resolve high-severity CVEs:
# GHSA-r28c-9q8g-f849 + GHSA-6g55-p6wh-862q (postcss path traversal via sourceMappingURL)
# GHSA-2v37-7h3g-55p8 (nanoid infinite loop DoS on zero-size generator)
overrides:
  postcss: ">=8.5.18"
  nanoid: ">=3.3.18"
  sharp: ">=0.35.0"
